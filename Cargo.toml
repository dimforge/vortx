[package]
name = "vortx"
authors = ["Sébastien Crozet <sebcrozet@dimforge.com>"]
description = "Cross-platform GPU tensor library with Rust."
repository = "https://github.com/dimforge/vortx"
version = { workspace = true }
edition = "2024"
license = "Apache-2.0"
exclude = ["assets/vortx-logo.png", "assets/vortx-logo2.png"]

[workspace]
members = [
    "vortx-shaders"
]
resolver = "2"

[features]
default = ["webgpu"]
webgpu = [ "khal/webgpu" ]
cpu = ["khal/cpu", "vortx-shaders/cpu"]
cpu-parallel = ["cpu", "vortx-shaders/cpu-parallel"]
cuda = ["khal/cuda", "khal-builder/cuda", "vortx-shaders/cuda"]
# Native CUDA with kernels compiled by cuda-oxide (`cargo oxide`) instead of
# rust-cuda's `cargo cuda`. Implies `cuda`.
# Not forwarded to `vortx-shaders/cuda-oxide`: khal-builder enables that in its
# own `cargo oxide` build; in the host build it would break the CPU backend
# (GPU-only libdevice externs in khal-std's `Float`).
cuda-oxide = ["cuda", "khal-builder/cuda-oxide"]
metal = ["khal/metal"]
push_constants = ["khal/push_constants", "vortx-shaders/push_constants"]
subgroup_ops = ["khal/subgroup_ops", "vortx-shaders/subgroup_ops"]
unsafe_remove_boundchecks = []
# Enables machine-learning (llm inference, reinforcement learning, etc.) operators.
ml = ["vortx-shaders/ml"]

[workspace.package]
version = "0.5.0"

[workspace.dependencies]
khal-std = "0.4"
khal = { version = "0.4", features = ["derive"]}

[dependencies]
bytemuck = "1"
include_dir = "0.7"
nalgebra = "0.35"
khal = { workspace = true }
khal-std = { workspace = true }
# Shader crate provides both GPU shader code and generated ShaderArgs via spirv_bindgen
vortx-shaders = { version = "0.5", path = "vortx-shaders" }
rand = { version = "0.10", optional = true }

[dev-dependencies]
nalgebra = { version = "0.35", features = ["rand"] }
half = "2"
futures-test = "0.3"
serial_test = "3"
approx = "0.5"
async-std = { version = "1", features = ["attributes"] }
plotly = "0.12.1"
indexmap = "2"
anyhow = "1"
wgpu = "30"

[build-dependencies]
khal-builder = "0.4"
# To build the shader from the dependency instead of local path.
vortx-shaders = { version = "0.5", path = "./vortx-shaders" }

[patch.crates-io]
#khal-builder = { path = "../khal/crates/khal-builder" }
#khal = { path = "../khal/crates/khal" }
#khal-std = { path = "../khal/crates/khal-std" }
#khal-derive = { path = "../khal/crates/khal-derive" }
#glamx = { git = "https://github.com/dimforge/glamx", branch = "bytemuck" }
